[pytest]
pythonpath = ../src

markers =
    slow: marks tests as slow (deselected by default, use --run-slow)
    integration: marks tests as integration tests (require real assets)
    asyncio: mark test as async

env =
    OAUTH_GITHUB_CLIENT_ID=test-dummy-id
    OAUTH_GITHUB_CLIENT_SECRET=test-dummy-secret
    CHAINLIT_DB_PATH=/tmp/test_chainlit.db
