# Docker DNS resolver — required so nginx re-resolves upstream hostnames
# when containers restart and get new IPs. Without this, nginx caches DNS
# results indefinitely, causing 502 errors after container restarts.
resolver 127.0.0.11 valid=10s;

upstream flask_app { server website:5000; }
upstream streamlit  { server chat:8501; }

server {
    listen 80;
    client_max_body_size 50M;

    # Chat service (Streamlit) — served under /app
    # Streamlit's baseUrlPath is "/app", so it generates /app/... URLs internally.
    # We proxy /app/ to Streamlit's root and forward WebSocket upgrades.
    location /app/ {
        # NOTE: no trailing slash on proxy_pass — Streamlit has baseUrlPath="/app"
        # so it expects the full /app/... path. Without trailing slash, nginx
        # passes the original request URI (including /app/) as-is.
        proxy_pass         http://streamlit;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade              $http_upgrade;
        proxy_set_header   Connection           "upgrade";
        proxy_set_header   Host                 $host;
        proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto    $scheme;
        proxy_set_header   X-Forwarded-Host     $host;
        proxy_set_header   X-Forwarded-Prefix   /app;
    }

    # Redirect /app → /app/ (trailing slash required by Streamlit)
    location = /app {
        return 301 /app/;
    }

    # Chainlit Conversational AI — served under /chat
    # Chainlit runs on port 8001 internally and supports WebSocket connections.
    # File uploads up to 50 MB are supported (matching the server-level limit).
    # NOTE: proxy_pass uses a variable ($upstream_chainlit) to force nginx to
    # re-resolve the hostname via the Docker DNS resolver on every request,
    # preventing 502 errors when the chainlit container restarts and gets a new IP.
    location /chat/ {
        client_max_body_size 50M;
        set $upstream_chainlit "http://chainlit:8001";
        proxy_pass         $upstream_chainlit;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade              $http_upgrade;
        proxy_set_header   Connection           "upgrade";
        proxy_set_header   Host                 $host;
        proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto    $scheme;
        proxy_set_header   X-Forwarded-Host     $host;
        proxy_set_header   X-Forwarded-Prefix   /chat;
    }

    # Redirect /chat → /chat/
    location = /chat {
        return 301 /chat/;
    }

    # Uploaded files (served from the shared chainlit_data volume)
    location /chat/uploads/ {
        alias /data/chainlit/uploads/;
        add_header Cache-Control "private, max-age=3600";
    }

    # Website service (Flask) — everything else
    location / {
        proxy_pass       http://flask_app;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
    }
}
