[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# ---------------------------------------------------------------------------
# pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# Add the project root to sys.path so that ``import website`` works in tests.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "backend_required: requires the FastAPI backend to be running",
    "website_required: requires the Flask website service to be running",
    "chat_required: requires the Streamlit chat service to be running",
    "frontend_required: requires the legacy Streamlit frontend to be running",
    "playwright: Playwright browser-based end-to-end test",
]
# Suppress noisy third-party deprecation warnings
filterwarnings = [
    "ignore::DeprecationWarning:flask_talisman",
    "ignore::DeprecationWarning:flask_limiter",
]