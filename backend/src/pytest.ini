[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: marks tests as integration (requires external dependencies)
    slow: marks tests as slow (skip by default)
    nlp: marks test for nlp services
    openai: marks tests for OpenAI backend (skip by default, use --run-openai to run)
    anthropic: marks tests for Anthropic backend (skip by default, use --run-anthropic to run)
    ollama: marks tests for Ollama backend (skip by default, use --run-ollama to run)
    openrouter: marks tests for OpenRouter backend (skip by default, use --run-openrouter to run)
    mock: marks tests for Mock backend (skip by default, use --run-mock to run)